<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 290" fill="none">
  <defs>
    <linearGradient id="mtlGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="80%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="mtlNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <filter id="mtlShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#020617" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Luxury Global Trading & Navigation Emblem -->
  <g transform="translate(85, 14)" filter="url(#mtlShadow)">
    <!-- Outer Shield / Hexagon Frame -->
    <path d="M 135 6 L 235 40 L 235 138 L 135 186 L 35 138 L 35 40 Z" 
          fill="url(#mtlNavy)" 
          stroke="url(#mtlGold)" 
          stroke-width="3.5" 
          stroke-linejoin="round"/>
    
    <!-- Inner Border with dashed accents -->
    <path d="M 135 16 L 223 46 L 223 132 L 135 174 L 47 132 L 47 46 Z" 
          fill="none" 
          stroke="url(#mtlGold)" 
          stroke-width="1.2" 
          stroke-dasharray="4 3" 
          opacity="0.6"/>

    <!-- Dynamic "M" Monogram & Navigation Compass Star -->
    <!-- Stylized M / Wings / Maritime Trading Sails -->
    <path d="M 75 135 L 75 70 L 105 110 L 135 70 L 165 110 L 195 70 L 195 135" 
          fill="none" 
          stroke="url(#mtlGold)" 
          stroke-width="4.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Central Compass Star Crest -->
    <polygon points="135,38 142,54 158,61 142,68 135,84 128,68 112,61 128,54" 
             fill="url(#mtlGold)"/>

    <!-- Decorative Corner Nodes -->
    <circle cx="135" cy="16" r="3.5" fill="#fef08a"/>
    <circle cx="135" cy="174" r="3.5" fill="#fef08a"/>
    <circle cx="47" cy="89" r="3" fill="#f59e0b"/>
    <circle cx="223" cy="89" r="3" fill="#f59e0b"/>

    <!-- Global Latitude / Longitude Arc -->
    <path d="M 58 115 C 80 150, 190 150, 212 115" 
          fill="none" 
          stroke="url(#mtlGold)" 
          stroke-width="2" 
          opacity="0.8" 
          stroke-dasharray="3 3"/>
  </g>

  <!-- Brand Typography: MOSAFIR TRADING -->
  <text x="220" y="232" 
        text-anchor="middle" 
        font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" 
        font-size="23" 
        font-weight="900" 
        fill="#0f172a" 
        letter-spacing="3">
    MOSAFIR TRADING
  </text>

  <!-- Subtitle: — LLC — -->
  <g transform="translate(220, 264)">
    <line x1="-75" y1="-5" x2="-30" y2="-5" stroke="#d97706" stroke-width="2.5" stroke-linecap="round"/>
    <text x="0" y="0" 
          text-anchor="middle" 
          font-family="'Plus Jakarta Sans', system-ui, sans-serif" 
          font-size="15" 
          font-weight="800" 
          fill="#d97706" 
          letter-spacing="5">
      LLC
    </text>
    <line x1="30" y1="-5" x2="75" y2="-5" stroke="#d97706" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
